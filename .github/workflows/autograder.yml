name: Pac-Man Autograder CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  autograder:
    name: Run Berkeley Pac-Man Autograder
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: 🔍 Locate Autograder Directory
        id: locate_dir
        run: |
          if [ -f "autograder.py" ]; then
            echo "TARGET_DIR=." >> $GITHUB_ENV
          elif [ -f "Group_Project/search/autograder.py" ]; then
            echo "TARGET_DIR=Group_Project/search" >> $GITHUB_ENV
          elif [ -f "search/autograder.py" ]; then
            echo "TARGET_DIR=search" >> $GITHUB_ENV
          elif [ -f "search/search/autograder.py" ]; then
            echo "TARGET_DIR=search/search" >> $GITHUB_ENV
          else
            echo "Could not find autograder.py"
            exit 1
          fi

      - name: 🚀 Run Full Autograder (Q1 - Q7)
        run: |
          cd ${{ env.TARGET_DIR }}
          echo "Running autograder in directory: $(pwd)"
          python autograder.py
